<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Migraine care illustration</title>
  <desc id="desc">Abstract calm head shape with soft waves suggesting headache patterns and relief.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9ff"/>
      <stop offset="55%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#e8f4fc"/>
    </linearGradient>
    <linearGradient id="silhouette" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#9bb5fc"/>
      <stop offset="100%" stop-color="#5ec4c4"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ad7d7" stop-opacity="0"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7ad7d7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="48" fill="url(#bg)"/>
  <circle cx="240" cy="240" r="120" fill="#b3c6fc" opacity="0.2"/>
  <circle cx="560" cy="560" r="160" fill="#7ad7d7" opacity="0.18"/>
  <!-- Soft head / temple zone (abstract) -->
  <ellipse cx="400" cy="380" rx="200" ry="240" fill="url(#silhouette)" opacity="0.35"/>
  <ellipse cx="400" cy="360" rx="140" ry="200" fill="#fff" opacity="0.5"/>
  <!-- “Pain wave” arcs — migraine motif without depicting distress -->
  <path fill="none" stroke="url(#pulse)" stroke-width="14" stroke-linecap="round" d="M520 280 Q 680 340 600 460"/>
  <path fill="none" stroke="url(#pulse)" stroke-width="10" stroke-linecap="round" opacity="0.85" d="M540 220 Q 700 300 620 400"/>
  <path fill="none" stroke="url(#pulse)" stroke-width="8" stroke-linecap="round" opacity="0.65" d="M500 360 Q 640 400 560 500"/>
  <!-- Monitoring / care line -->
  <path fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" d="M160 620 L220 620 L250 540 L300 660 L360 560 L420 620 L640 620"/>
  <circle cx="400" cy="360" r="28" fill="#7ad7d7" opacity="0.55"/>
</svg>
